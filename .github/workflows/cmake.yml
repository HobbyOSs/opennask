name: CMake

on:
  push:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v2

      - name: install-cmake
        uses: Symbitic/install-cmake@v0.1.0
        with:
          cmake: 3.17.2
          ninja: 1.9.0

      - name: Install build tools
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: clang lld libc6-dev-i386 linux-headers-generic bison flex libfl-dev coreutils mtools
          version: 1.3

      - name: Set up Raku
        uses: Raku/setup-raku@v1

      - name: Install rakusk
        run: zef install https://github.com/HobbyOSs/rakusk.git --/test

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release              \
                -DCMAKE_C_COMPILER=clang                \
                -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        working-directory: ${{github.workspace}}/build
        run: ninja && ninja images

